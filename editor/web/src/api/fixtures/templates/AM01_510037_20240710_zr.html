<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>{{ fund.name }} 運用報告書</title>
    <link rel="stylesheet" href="css/{{ fund.code }}.css" />
  </head>
  <body>
    <header class="report-header">
      <h1 class="report-title">{{ fund.name }} 運用報告書（全体版）</h1>
      <p class="report-meta">基準日: {{ report.baseDate }}</p>
    </header>

    <section class="performance">
      <h2>期間別騰落率</h2>
      <ul class="perf-list">
        {% for p in performance %}
        <li class="perf-item">{{ p.period }}: {{ p.return }}%</li>
        {% endfor %}
      </ul>
    </section>

    <footer class="report-footer">
      <p>委託会社: {{ company.name }}（{{ company.code }}）</p>
    </footer>
  </body>
</html>
