<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RET — Report Edit Tool</title>
    <script>
      // Apply the saved/OS theme before first paint to avoid a flash.
      (() => {
        let t = 'light';
        try {
          t = localStorage.getItem('ret:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch {
          t = 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Webfonts are self-hosted via @fontsource (imported in src/main.ts); no
         external font CDN. See editor/OFFLINE.md. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
