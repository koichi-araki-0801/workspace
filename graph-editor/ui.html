<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ラベル位置エディタ</title>
  <style>
    :root {
      --bg: #1e1f22;
      --panel: #2b2d31;
      --panel2: #232428;
      --line: #3a3c42;
      --text: #e6e7ea;
      --muted: #9aa0a6;
      --accent: #4c9aff;
      --accent2: #ffb84c;
      --ok: #57c878;
      --danger: #e06c75;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* 上部バー */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      font-size: 14px;
      margin: 0 12px 0 0;
      font-weight: 600;
    }

    header .spacer {
      flex: 1;
    }

    button {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 11px;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    button.open {
      background: var(--accent2);
      border-color: var(--accent2);
      color: #1e1f22;
      font-weight: 600;
    }

    #status {
      font-size: 12px;
      color: var(--muted);
      min-width: 200px;
    }

    #status.ok {
      color: var(--ok);
    }

    #status.err {
      color: var(--danger);
    }

    /* 3 ペイン */
    main {
      display: grid;
      grid-template-columns: 230px 1fr 250px;
      min-height: 0;
    }

    .pane {
      overflow: auto;
      min-height: 0;
    }

    #list {
      background: var(--panel2);
      border-right: 1px solid var(--line);
      padding: 6px;
    }

    #list .empty {
      color: var(--muted);
      padding: 10px;
      font-size: 12px;
      line-height: 1.7;
    }

    #list .item {
      padding: 6px 9px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    #list .item:hover {
      background: var(--panel);
    }

    #list .item.active {
      background: var(--accent);
      color: #fff;
    }

    #list .item .edited {
      color: var(--accent2);
      margin-left: 5px;
    }

    #list .item.active .edited {
      color: #fff;
    }

    #canvasPane {
      background:
        repeating-conic-gradient(#2a2b2f 0% 25%, #25262a 0% 50%) 50% / 24px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    #canvas {
      background: #fff;
      box-shadow: 0 6px 30px rgba(0, 0, 0, .5);
    }

    #canvas:empty {
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      width: 70%;
      max-width: 560px;
      aspect-ratio: 11/8;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      line-height: 1.9;
    }

    #canvas:empty::before {
      content: "「開く」ボタンで SVG ファイルを選択してください\A（複数選択できます）";
      white-space: pre;
    }

    #canvas svg {
      display: block;
    }

    /* 編集オーバーレイ要素のスタイル (SVG 内へ注入) */
    #canvas .label-hit {
      fill: transparent;
      cursor: pointer;
    }

    #canvas g.label.is-selected .label-hit {
      stroke: var(--accent);
      stroke-width: 1;
      stroke-dasharray: 3 3;
      fill: rgba(76, 154, 255, .06);
    }

    #canvas g.label:hover .label-hit {
      fill: rgba(76, 154, 255, .05);
    }

    #inspector {
      background: var(--panel2);
      border-left: 1px solid var(--line);
      padding: 12px;
    }

    #inspector h2 {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    #inspector .name {
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
      margin-bottom: 12px;
    }

    #inspector .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    #inspector .row label {
      color: var(--muted);
      width: 64px;
      flex: none;
    }

    #inspector .coords {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--muted);
    }

    #inspector .toggle {
      display: flex;
      flex: 1;
      gap: 6px;
    }

    #inspector .toggle button {
      flex: 1;
    }

    #inspector .toggle button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    #inspector .hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    #inspector .empty {
      color: var(--muted);
      font-size: 12px;
    }

    kbd {
      background: #1a1b1e;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 4px;
      font-size: 11px;
    }

    #inspector input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <h1>SVG ラベル位置エディタ</h1>
    <button id="btnOpen" class="open">開く…</button>
    <button id="btnUndo" disabled title="Ctrl+Z">↶ Undo</button>
    <button id="btnReset" disabled>全体リセット</button>
    <span style="color:var(--muted)">ズーム</span>
    <button id="btnZoomOut">−</button>
    <button id="btnZoomIn">＋</button>
    <span class="spacer"></span>
    <span id="status">起動中…</span>
    <button id="btnSave" class="primary" disabled>保存…</button>
  </header>
  <main>
    <div id="list" class="pane">
      <div class="empty">まだファイルがありません。<br>上の「開く…」から SVG を選択してください。</div>
    </div>
    <div id="canvasPane" class="pane">
      <div id="canvas"></div>
    </div>
    <div id="inspector" class="pane">
      <h2>選択中のラベル</h2>
      <div id="inspectorBody">
        <div class="empty">ラベルをクリックして選択</div>
      </div>
    </div>
  </main>
  <!-- DOM 非依存の純粋関数 (引出線ジオメトリ/パース)。ui.html と vitest 単体テストで共有。
       classic script として global `LeaderGeom` を生やすため、main スクリプトより前に読み込む。 -->
  <script src="lib/leader_geom.cjs"></script>
  <script>
    // =============================================================================
    // SVG ラベル位置 ビジュアル編集 — クライアント (バニラ JS, 依存ゼロ)
    // ローカルの小さな HTTP サーバ (app.py) から http://127.0.0.1 で配信され、OS の Edge を
    // アプリモードで開いて動作する。ファイル I/O はブラウザの File System Access API
    // (showOpenFilePicker / showSaveFilePicker) でネイティブダイアログを使う (localhost は
    // secure context なので利用可)。非対応ブラウザでは input/ダウンロードへフォールバックする。
    //
    // 構成: 状態 + ライフサイクル + 描画は Editor クラスに集約し、1ラベル分の状態と
    // DOM 同期は LabelState クラスが持つ。描画はホットパス (ドラッグ中の pointermove)
    // で個別の renderX を直呼びせず markDirty() で dirty フラグを立て、requestAnimationFrame
    // で 1 フレーム最大 1 回へ合流させる (描画スケジューラ)。インスペクタ/オーバーレイは
    // 構造シグネチャが変わった時だけ作り直し、通常フレームは読出し値/座標だけを更新する。
    // =============================================================================

    const SVG_NS = "http://www.w3.org/2000/svg";

    // 共有純粋関数を取り込む (lib/leader_geom.cjs)。呼び出し側はこれまでと同じ名前で使える。
    const { parsePath, buildPath, parseTranslate, normColor, clampPointToBox } = LeaderGeom;

    // 文字色の正規値 (生成側: 通常=#111111 / inside=#ffffff)。比較・既定値に使う。
    const WHITE = "#ffffff";
    const BLACK = "#111111";

    // 調整用の定数 (見かけサイズ・閾値・既定値を一元管理)
    const CONFIG = {
      handleScreenRadius: 5,   // ハンドルの見かけ半径 (ズームで割って一定化)
      pieRadiusRatio: 0.35,    // slice から半径を推定できない時のフォールバック係数
      historyLimit: 100,       // Undo 履歴の保持上限
      hitPadding: 3,           // ヒット矩形の bbox からの余白
      zoomMin: 0.4,
      zoomMax: 3,
      zoomStep: 1.2,           // ＋/− ボタン 1 回あたりの倍率
      nudgeStep: 1,            // 矢印キーの移動量 (px)
      nudgeStepFast: 10,       // Shift+矢印の移動量 (px)
      vecEpsilon: 1e-6,        // ベクトル長がこの値未満なら方向を既定化
      roundPrecision: 1e6,     // 座標焼き込み時の丸め精度
      defaultViewBox: { w: 550, h: 400 }, // viewBox 取得失敗時の既定サイズ
      condenseMin: 0.7,        // 長体 (横圧縮) の下限率
      condenseStep: 0.01,      // 長体スライダの刻み
      defaultLineSpacing: 1.1, // 行間 (em)。SVG から検出できない時の既定
    };

    // 新規 leader の既定 stroke 系属性 (既存 leader が無い場合に使用)
    const DEFAULT_LEADER_STYLE = {
      stroke: "#6a6a6a", "stroke-width": "1.008",
      "stroke-linecap": "round", "stroke-linejoin": "round",
    };

    // UI 文言 (HTML マークアップと重複する箇所は同一文字列を保つこと)
    const EMPTY_LIST_HTML = "まだファイルがありません。<br>上の「開く…」から SVG を選択してください。";
    const STATUS_READY = "「開く…」で SVG ファイルを選択してください";

    // インスペクタ未選択時の表示
    const INSPECTOR_EMPTY_HTML = '<div class="empty">ラベルをクリックして選択</div>';

    // インスペクタ下部の固定操作ヒント
    const INSPECTOR_HINT_HTML = `
    <div class="hint">
      ・テキストを掴んでドラッグで移動<br>
      ・<span style="color:#57c878">●</span>端点 / <span style="color:#4c9aff">●</span>曲点 / <span style="color:#ffb84c">●</span>アンカー をドラッグ<br>
      ・「行数」で 1行↔2行、「長体」スライダで横圧縮 (100〜70%)<br>
      ・リーダー無しは「追加」、曲げ点は最大1つ(追加/削除)<br>
      ・<kbd>←↑↓→</kbd> 1px / <kbd>Shift</kbd>+矢印 10px<br>
      ・<kbd>Ctrl</kbd>+<kbd>Z</kbd> Undo
    </div>`;

    // インスペクタのボタン操作表。{ guard(s):状態が操作可能か, run(editor, s):状態変更 }。
    // 共通の pushHistory / markDirty は inspectorAction() 側で 1 度だけ行う。
    // _auto=false は「明示操作したら以後のドラッグで位置駆動の自動上書きをしない」印。
    const INSPECTOR_ACTIONS = {
      leaderOn:     { guard: (s) => s.leaderPts.length && !s.leaderVisible,
                      run: (e, s) => { s.leaderVisible = true; s._auto = false; } },
      leaderOff:    { guard: (s) => s.leaderVisible,
                      run: (e, s) => { s.leaderVisible = false; s._auto = false; } },
      leaderAdd:    { guard: (s) => s.leaderPts.length === 0,
                      run: (e, s) => { s.leaderPts = e.defaultLeaderPts(s); s.leaderVisible = true; s._auto = false; } },
      leaderDelete: { guard: (s) => s.leaderPts.length,
                      run: (e, s) => { s.leaderPts = []; s.leaderVisible = false; } },
      bendAdd:      { guard: (s) => s.leaderPts.length === 2,
                      run: (e, s) => {
                        const [a, b] = s.leaderPts;
                        s.leaderPts = [a, { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, b];
                        s._auto = false;
                      } },
      bendRemove:   { guard: (s) => s.leaderPts.length >= 3,
                      run: (e, s) => { s.leaderPts = [s.leaderPts[0], s.leaderPts[s.leaderPts.length - 1]]; s._auto = false; } },
      lines1:       { guard: (s) => s.lineCount !== 1, run: (e, s) => { s.lineCount = 1; } },
      lines2:       { guard: (s) => s.lineCount !== 2, run: (e, s) => { s.lineCount = 2; } },
      insideOn:     { guard: (s) => s.fill !== WHITE, run: (e, s) => { s.fill = WHITE; } },
      insideOff:    { guard: (s) => s.fill === WHITE,
                      // 元が白文字なら黒へ、それ以外は元の色へ戻す (元色が無ければ黒)
                      run: (e, s) => { s.fill = s.whiteType ? BLACK : (s.originalFill != null ? s.originalFill : BLACK); } },
      resetOne:     { guard: (s) => true, run: (e, s) => { s.apply(s.initial); } },
    };

    const dom = {
      list: document.getElementById("list"),
      canvas: document.getElementById("canvas"),
      inspectorBody: document.getElementById("inspectorBody"),
      status: document.getElementById("status"),
      btnOpen: document.getElementById("btnOpen"),
      btnSave: document.getElementById("btnSave"),
      btnUndo: document.getElementById("btnUndo"),
      btnReset: document.getElementById("btnReset"),
      btnZoomIn: document.getElementById("btnZoomIn"),
      btnZoomOut: document.getElementById("btnZoomOut"),
    };

    // ---------------------------------------------------------------------------
    // 純粋ユーティリティ (状態を持たない)
    // ---------------------------------------------------------------------------

    // parsePath / buildPath / parseTranslate は lib/leader_geom.cjs へ移設 (冒頭で分割代入)。

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function round(n) {
      return Math.round(n * CONFIG.roundPrecision) / CONFIG.roundPrecision;
    }

    /** SVG 要素を生成し属性をまとめて設定する (値は setAttribute へ渡り文字列化される)。 */
    function createSvgEl(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    /** getBBox は detached/未レイアウト時に例外を投げる。失敗時は fallback を返す。 */
    function safeGetBBox(el, fallback = { x: 0, y: 0, width: 0, height: 0 }) {
      try {
        return el.getBBox();
      } catch {
        return fallback;
      }
    }

    /** トグルボタンの active クラス文字列 ("on" or "") */
    const onClass = (cond) => (cond ? "on" : "");

    /** インスペクタの移動量表示 (構築時と読出し更新で同一文字列を使う) */
    const formatCoords = (tx) => `移動量 dx ${tx.x.toFixed(1)} / dy ${tx.y.toFixed(1)} px`;

    // normColor は lib/leader_geom.cjs へ移設 (冒頭で分割代入)。

    /** 未信頼 SVG を DOM 接続前に無害化する (多層防御)。
     *  innerHTML 経由では <script> は実行されないが、<image onerror> 等のインライン
     *  イベント属性は発火しうる。接続前に DOMParser で組み立て、<script> 要素・on* 属性・
     *  javascript: な href を除去した <svg> 要素を返す。解釈不能なら null。 */
    function sanitizeSvg(svgText) {
      const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
      const root = doc.documentElement;
      if (!root || root.nodeName === "parsererror" || root.querySelector("parsererror")) return null;
      if (root.nodeName.toLowerCase() !== "svg") return null;
      const strip = (el) => {
        for (const attr of [...el.attributes]) {
          const name = attr.name.toLowerCase();
          if (name.startsWith("on")) el.removeAttribute(attr.name);
          else if ((name === "href" || name === "xlink:href") && /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
        }
      };
      root.querySelectorAll("script").forEach((el) => el.remove());
      strip(root);
      const walker = doc.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
      let node;
      while ((node = walker.nextNode())) strip(node);
      return root;
    }

    // File System Access API が使えるか (Chromium 系 + secure context=localhost)。
    function hasFsAccess() {
      return typeof window.showOpenFilePicker === "function" && typeof window.showSaveFilePicker === "function";
    }

    // 開く/保存ダイアログのファイル種別フィルタ。
    const SVG_PICKER_TYPES = [{ description: "SVG ファイル", accept: { "image/svg+xml": [".svg"] } }];

    // 編集で変化し Undo/リセット対象となるフィールドと、その複製方法を一元定義。
    // LabelState.snapshot / apply の双方がこれを参照するため、項目追加はここ 1 箇所で済む。
    const STATE_FIELDS = {
      textTx: (v) => ({ ...v }),
      leaderPts: (v) => v.map((p) => ({ ...p })),
      leaderVisible: (v) => v,
      fill: (v) => v,
      lineCount: (v) => v,    // 1 | 2 (1行化/2行化)
      nameScaleX: (v) => v,   // 名前の横圧縮率 (長体)。1=圧縮なし
    };

    // ---------------------------------------------------------------------------
    // ラベル状態 (1 ラベル分の状態と実 DOM 同期)
    // ---------------------------------------------------------------------------

    class LabelState {
      constructor(g, editor) {
        this.editor = editor;
        const text = g.querySelector("text");
        const path = g.querySelector("path");
        const tx = parseTranslate(text.getAttribute("transform"));
        this.g = g;
        this.text = text;
        this.path = path;
        this.name = g.getAttribute("data-name") || "(no name)";
        this.textTx = { ...tx };
        this.leaderPts = path ? parsePath(path.getAttribute("d")) : [];
        // 読込時から円側端点をスライス中心角リム点へ固定 (initial スナップショットにも反映)
        if (this.leaderPts.length >= 2) {
          const a = editor.sliceMidAnchor(this.name);
          if (a) this.leaderPts[0] = { x: a.x, y: a.y };
        }
        this.leaderVisible = !!path;
        this.originalFill = text.getAttribute("fill");
        this.fill = this.originalFill;
        // 行数 / 長体 / 名前・パーセント文字列を SVG から復元 (1行化・2行化・長体の編集に使う)。
        // 文字内容は data 属性を優先し、無ければ実 tspan から拾う (graph2 以外の SVG への保険)。
        const tspans = [...text.querySelectorAll("tspan")];
        const pctAttr = g.getAttribute("data-percent");
        this.percentText = pctAttr != null && pctAttr !== ""
          ? `${pctAttr}%`
          : (tspans.length ? tspans[tspans.length - 1].textContent.trim() : "");
        const lc = parseInt(g.getAttribute("data-line-count"), 10);
        // data-line-count 優先。無ければ x 指定を持つ tspan 数 (=行頭の数) で推定。
        this.lineCount = lc === 2 ? 2 : lc === 1 ? 1
          : (tspans.filter((t) => t.hasAttribute("x")).length >= 2 ? 2 : 1);
        const sxAttr = parseFloat(g.getAttribute("data-name-scale-x"));
        this.nameScaleX = sxAttr > 0 && sxAttr < 1 ? sxAttr : 1;
        this.baselineRaw = text.getAttribute("dominant-baseline") || "middle";
        // 行間 (em): 既存 tspan の 0 でない dy から検出。無ければ既定。
        let ls = CONFIG.defaultLineSpacing;
        for (const t of tspans) {
          const m = (t.getAttribute("dy") || "").match(/(-?\d*\.?\d+)\s*em/);
          if (m) { const v = Math.abs(parseFloat(m[1])); if (v > 0.01) { ls = v; break; } }
        }
        this.lineSpacing = ls;
        // 現在 DOM に焼かれている text 内容のシグネチャ。これと state がずれた時だけ再構築する。
        this._renderedTextSig = `${this.lineCount}|${this.nameScaleX}`;
        // 白文字 (inside スライス) タイプか — 円外/円内で色を切替える判定に使う。
        // 生成出力は厳密に #ffffff だが、表記揺れに備え正規化して比較する。
        this.whiteType = normColor(this.originalFill) === WHITE;
        this._auto = false;    // leader が自動生成 (位置駆動) か手動かの識別
        this._hitRect = null;  // ドラッグ用の透明ヒット矩形
        // リセット用の初期スナップショット
        this.initial = this.snapshot();
      }

      snapshot() {
        const snap = {};
        for (const [k, copy] of Object.entries(STATE_FIELDS)) snap[k] = copy(this[k]);
        return snap;
      }

      apply(snap) {
        for (const [k, copy] of Object.entries(STATE_FIELDS)) this[k] = copy(snap[k]);
      }

      /** ヒット矩形を text と同じ transform へ追従させる */
      syncHit() {
        const rect = this._hitRect;
        if (!rect) return;
        if (this.textTx.x || this.textTx.y) rect.setAttribute("transform", `translate(${this.textTx.x},${this.textTx.y})`);
        else rect.removeAttribute("transform");
      }

      /** s.path が無ければ leader <path> を生成し text の背面へ挿入 */
      ensurePath() {
        if (this.path) return this.path;
        const path = createSvgEl("path", { fill: "none", ...this.editor.leaderStyleTemplate() });
        // text (とヒット矩形) の背面に置く
        this.g.insertBefore(path, this.text);
        this.path = path;
        return path;
      }

      /** 行数(1/2) と 長体率 に基づき <text> 内の tspan を組み直す。生成側 textFragment と同じ
       *  構造: 1行目=名前 (長体なら textLength+lengthAdjust)、続いて パーセント。
       *  - 2行: 名前と % を別行 (各行 x 指定 + dy で改行)
       *  - 1行: 名前 tspan の後ろに " %" を x/dy 無しで同チャンク流し込み (text-anchor 維持)
       *  長体の textLength は実フォントでの素の送り幅 (getComputedTextLength) × 率 で算出する。 */
      rebuildTextContent() {
        const text = this.text;
        const x = text.getAttribute("x") || "0";
        const L = this.lineSpacing;
        const two = this.lineCount >= 2;
        const sx = this.nameScaleX;
        // baseline ごとの 1 行目 dy (生成側と一致)
        let firstDy;
        if (this.baselineRaw === "text-before-edge") firstDy = "0em";
        else if (this.baselineRaw === "text-after-edge") firstDy = two ? `${-(this.lineCount - 1) * L}em` : "0em";
        else firstDy = two ? `${(-(this.lineCount - 1) * L) / 2}em` : "0em";

        const nameT = createSvgEl("tspan", { x, dy: firstDy });
        // 2行+長体: 横圧縮(textLength)は行位置(dy)を持つ tspan に同居させると Chromium で
        // 後続行の行送りが壊れ重なる/消える。圧縮を内側 tspan へ隔離して行送りを守る。
        let nameTarget = nameT;
        if (two && sx < 1) {
          const inner = createSvgEl("tspan");
          nameT.appendChild(inner);
          nameTarget = inner;
        }
        nameTarget.textContent = this.name;

        const pctT = createSvgEl("tspan");
        if (two) {
          pctT.setAttribute("x", x);
          pctT.setAttribute("dy", `${L}em`);
          pctT.textContent = this.percentText;
        } else {
          // 同一チャンクに流す (x/dy 無し)。先頭スペースで名前と数値を区切る。
          pctT.textContent = ` ${this.percentText}`;
        }
        text.replaceChildren(nameT, pctT);

        // 長体: 素の送り幅を測ってから textLength を与える (測定は textLength 無しの状態で)
        if (sx < 1) {
          let natural = 0;
          try { natural = nameTarget.getComputedTextLength(); } catch { natural = 0; }
          if (natural > 0) {
            nameTarget.setAttribute("textLength", (natural * sx).toFixed(2));
            nameTarget.setAttribute("lengthAdjust", "spacingAndGlyphs");
          }
        }

        // <g> の data 属性も実態に合わせる (保存後に再読込しても状態が残るように)
        this.g.setAttribute("data-line-count", two ? "2" : "1");
        if (sx < 1) this.g.setAttribute("data-name-scale-x", String(sx));
        else this.g.removeAttribute("data-name-scale-x");

        this.refreshHitRect();
      }

      /** text の現 bbox からヒット矩形を再計測 (行数/長体で寸法が変わった後に呼ぶ) */
      refreshHitRect() {
        const rect = this._hitRect;
        if (!rect) return;
        const bbox = safeGetBBox(this.text, null);
        if (!bbox) return;
        const pad = CONFIG.hitPadding;
        rect.setAttribute("x", bbox.x - pad);
        rect.setAttribute("y", bbox.y - pad);
        rect.setAttribute("width", bbox.width + pad * 2);
        rect.setAttribute("height", bbox.height + pad * 2);
        this.syncHit();
      }

      /** JS 状態を実 DOM へ反映 */
      renderToDom() {
        // 行数/長体が変わっていれば tspan を組み直す (位置・色より先に確定させる)
        const textSig = `${this.lineCount}|${this.nameScaleX}`;
        if (textSig !== this._renderedTextSig) {
          this.rebuildTextContent();
          this._renderedTextSig = textSig;
        }
        if (this.textTx.x === 0 && this.textTx.y === 0) {
          this.text.removeAttribute("transform");
        } else {
          this.text.setAttribute("transform", `translate(${this.textTx.x},${this.textTx.y})`);
        }
        // fill が無い text (originalFill=null) は属性を触らない ("null" 焼き込み防止)
        if (this.fill != null && this.fill !== "") this.text.setAttribute("fill", this.fill);
        if (this.leaderPts.length >= 2) {
          // 円側端点は常にスライス中心角リム点へロック (生成/編集経路を問わず固定)
          const a = this.editor.sliceMidAnchor(this.name);
          if (a) this.leaderPts[0] = { x: a.x, y: a.y };
          this.ensurePath();
          this.path.setAttribute("d", buildPath(this.leaderPts));
          this.path.style.display = this.leaderVisible ? "" : "none";
        } else if (this.path) {
          // リーダー無し状態: DOM から path を除去 (Undo/削除で再導出される)
          this.path.remove();
          this.path = null;
        }
        this.syncHit();
      }
    }

    // ---------------------------------------------------------------------------
    // エディタ本体 (セッション状態 + ライフサイクル + 描画オーケストレーション)
    // ---------------------------------------------------------------------------

    class Editor {
      constructor(dom) {
        this.dom = dom;

        // 現在の編集セッション状態
        this.name = null;        // 読込中のファイル名 (表示用。同定には使わない)
        this.currentId = null;   // 読込中アイテムの id (同名ファイルを取り違えないため)
        this.svg = null;         // インライン SVG ルート要素
        this.overlay = null;     // ハンドル等を入れる <g> (保存時に除去)
        this.labels = [];        // LabelState の配列
        this.selected = null;    // 選択中ラベル状態
        this.history = [];       // Undo 用スナップショット
        this.zoom = 1;
        this.baseW = 0;
        this.baseH = 0;
        this._pie = null;        // パイ中心・半径のキャッシュ {cx,cy,r}
        this._leaderStyle = null;// 新規 leader 用 stroke 属性のキャッシュ
        this._sliceByName = null;// data-name → スライス<path> の Map (遅延構築)
        this._sliceAnchor = null;// data-name → 中心角リム点 {x,y}|null のキャッシュ
        this.items = [];         // 読み込んだファイル群 (メモリ保持) … {id, name, content, edited?}
        this._itemSeq = 0;       // items に振る一意 id の採番 (同名でも区別する)
        this._loadSeq = 0;       // load() 再入の後勝ち判定 (fonts.ready 待ちのレース回避)

        // 描画スケジューラ (rAF + dirty フラグ)
        this._dirty = { dom: false, overlay: false, inspector: false };
        this._frame = 0;         // rAF ハンドル (0=未予約)
        // インスペクタの構造再構築判定 + 座標表示の参照キャッシュ
        this._inspSig = null;
        this._inspCoordEl = null;
        // オーバーレイのハンドル要素キャッシュ + 構造再構築判定
        this._handles = [];
        this._overlaySig = null;
      }

      // -------------------------------------------------------------------------
      // 共通
      // -------------------------------------------------------------------------

      setStatus(msg, kind = "") {
        this.dom.status.textContent = msg;
        this.dom.status.className = kind;
      }

      /** マウスイベント client 座標 → SVG ユーザー単位。
       *  inv (逆 CTM) を渡すと getScreenCTM 呼び出しを省ける (ドラッグ中の reflow 回避)。 */
      toSvgPoint(evt, inv) {
        const pt = this.svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(inv || this.svg.getScreenCTM().inverse());
      }

      // -------------------------------------------------------------------------
      // 円幾何 / leader スタイル (セッション状態に依存)
      // -------------------------------------------------------------------------

      /** 円(パイ)の中心・半径を slice パスから推定 (リーダー後付けの既定座標に使用) */
      getPieGeometry() {
        if (this._pie) return this._pie;
        let geom = null;
        const slicePath = this.svg && this.svg.querySelector("#slices .slice path, #slices path");
        if (slicePath) {
          const d = slicePath.getAttribute("d") || "";
          const m = d.match(/M\s*(-?\d*\.?\d+)[ ,]+(-?\d*\.?\d+)/);
          const a = d.match(/A\s*(-?\d*\.?\d+)[ ,]+(-?\d*\.?\d+)/);
          if (m && a) {
            geom = { cx: parseFloat(m[1]), cy: parseFloat(m[2]), r: parseFloat(a[1]) };
          }
        }
        if (!geom) {
          geom = { cx: this.baseW / 2, cy: this.baseH / 2, r: Math.min(this.baseW, this.baseH) * CONFIG.pieRadiusRatio };
        }
        this._pie = geom;
        return geom;
      }

      /** data-name → スライス<path> の Map を一度だけ構築 (属性エスケープ回避のため走査) */
      _sliceMap() {
        if (this._sliceByName) return this._sliceByName;
        const map = new Map();
        const slices = this.svg ? this.svg.querySelectorAll("#slices g.slice") : [];
        slices.forEach((g) => {
          const name = g.getAttribute("data-name");
          const path = g.querySelector("path");
          if (name != null && path && !map.has(name)) map.set(name, path);
        });
        this._sliceByName = map;
        return map;
      }

      /** 指定ラベル名のスライスの「中心角リム点」を返す。leader 円側アンカーの固定先。
       *  楔形パス (M中心 L始点 A終点 Z) は両直線脚が半径 r で等長のため、円弧中点 =
       *  パス全長の中央 = 中心角リム点になる (getPointAtLength(total/2))。
       *  スライス未発見/楔形でない (例: 100% 単一スライスは L 無し+2連 A) 場合は null。 */
      sliceMidAnchor(name) {
        if (!this._sliceAnchor) this._sliceAnchor = new Map();
        if (this._sliceAnchor.has(name)) return this._sliceAnchor.get(name);
        let anchor = null;
        const path = this._sliceMap().get(name);
        const d = path && (path.getAttribute("d") || "");
        // 楔形 (M…L…A…) のみ対象。それ以外は中心角が定義できないので退避。
        if (path && /M[^A-Za-z]*L[^A-Za-z]*A/.test(d)) {
          try {
            const total = path.getTotalLength();
            if (total > 0) {
              const p = path.getPointAtLength(total / 2);
              anchor = { x: p.x, y: p.y };
            }
          } catch { anchor = null; }
        }
        this._sliceAnchor.set(name, anchor);
        return anchor;
      }

      /** 既存 leader から stroke 系属性を借用 (無ければ既定値) */
      leaderStyleTemplate() {
        if (this._leaderStyle) return this._leaderStyle;
        const style = { ...DEFAULT_LEADER_STYLE };
        const existing = this.svg && this.svg.querySelector('#labels path[fill="none"]');
        if (existing) {
          for (const k of Object.keys(style)) {
            const v = existing.getAttribute(k);
            if (v != null) style[k] = v;
          }
        }
        this._leaderStyle = style;
        return style;
      }

      /** リーダー後付け時の既定 2 点 [リム上アンカー, ラベル端点] を算出。
       *  bbox 省略時は getBBox。ドラッグ中は開始時 bbox を渡し reflow を避ける。 */
      defaultLeaderPts(s, bbox) {
        const { cx, cy, r } = this.getPieGeometry();
        if (!bbox) bbox = safeGetBBox(s.text, { x: cx, y: cy, width: 0, height: 0 });
        const left = bbox.x + s.textTx.x;
        const top = bbox.y + s.textTx.y;
        const right = left + bbox.width;
        const bottom = top + bbox.height;
        // ラベル矩形上で中心に最も近い点 = 端点
        const endpoint = {
          x: Math.max(left, Math.min(cx, right)),
          y: Math.max(top, Math.min(cy, bottom)),
        };
        // アンカー = スライス中心角リム点 (固定)。未取得時のみ中心→端点 方向のリム点へ退避。
        let anchor = this.sliceMidAnchor(s.name);
        if (!anchor) {
          let dx = endpoint.x - cx;
          let dy = endpoint.y - cy;
          const len = Math.hypot(dx, dy);
          if (len < CONFIG.vecEpsilon) { dx = 1; dy = 0; }
          const ux = dx / (len || 1);
          const uy = dy / (len || 1);
          anchor = { x: cx + ux * r, y: cy + uy * r };
        }
        return [anchor, endpoint];
      }

      /** leader 末尾(端点)を必ずラベル外枠上へ置く。アンカー/曲げ点は保持。
       *  手前の点をラベル矩形へクランプ = 外枠上の最近点。bbox は素の getBBox 値。 */
      snapEndpointToFrame(s, bbox) {
        const n = s.leaderPts.length;
        if (n < 2) return;
        const left = bbox.x + s.textTx.x;
        const top = bbox.y + s.textTx.y;
        const box = { left, top, right: left + bbox.width, bottom: top + bbox.height };
        s.leaderPts[n - 1] = clampPointToBox(s.leaderPts[n - 2], box);
      }

      /** ラベル移動後の leader 追従。既存 leader を持ち円外なら端点を外枠上へ
       *  再スナップ(アンカー/曲げ点は保持)、それ以外は位置駆動ルール。
       *  basePts 指定時はそれを基準に復元 (ドラッグ中の連続適用用)。 */
      followLeaderAfterMove(s, bbox, basePts) {
        const pts = basePts || s.leaderPts;
        if (pts.length >= 2 && this.isOutsideRim(s, bbox)) {
          s.leaderPts = pts.map((q) => ({ ...q })); // アンカー/曲げ点を保持
          this.snapEndpointToFrame(s, bbox);
          if (s.whiteType) s.fill = BLACK;
        } else {
          this.applyRimLeaderRule(s, bbox);
        }
      }

      /** ラベル(text bbox)の中心点 (textTx 反映)。bbox 省略時は getBBox。 */
      labelCenterPoint(s, bbox) {
        let b = bbox;
        if (!b) {
          b = safeGetBBox(s.text, null);
          if (!b) return null;
        }
        return { x: b.x + b.width / 2 + s.textTx.x, y: b.y + b.height / 2 + s.textTx.y };
      }

      /** ラベル中心が円周の外にあるか。bbox 省略時は getBBox。 */
      isOutsideRim(s, bbox) {
        const { cx, cy, r } = this.getPieGeometry();
        const c = this.labelCenterPoint(s, bbox);
        if (!c) return false;
        return Math.hypot(c.x - cx, c.y - cy) > r;
      }

      // leader 状態モデル:
      //   _auto=true  … 位置駆動で生成された leader。円外で生成/端点追従し、円内で除去する。
      //   _auto=false … ユーザー管理の leader (ファイル由来 / 手動追加 / 頂点や曲げ点を手動編集)。
      //                 位置ルールは削除も可視性の強制もしない (ユーザーの意思を保持)。
      /** 位置駆動の leader ルール: 円外なら自動 leader を確保・円内なら自動分のみ除去。
       *  白文字タイプは円外で黒・円内で白に切替 (視認性)。bbox 省略時は getBBox。 */
      applyRimLeaderRule(s, bbox) {
        if (this.isOutsideRim(s, bbox)) {
          if (s.leaderPts.length === 0 || s._auto) {
            // 自動 leader を (再)生成。生成分だけ可視を強制する。
            s.leaderPts = this.defaultLeaderPts(s, bbox);
            s._auto = true;
            s.leaderVisible = true;
          }
          // 手動 leader (_auto=false) は pts も可視性も触れない。
          if (s.whiteType) s.fill = BLACK;
        } else {
          if (s._auto) {
            // 自動生成分のみ除去。手動 leader は保持する。
            s.leaderPts = [];
            s.leaderVisible = false;
            s._auto = false;
          }
          if (s.whiteType) s.fill = WHITE;
        }
      }

      // -------------------------------------------------------------------------
      // 描画スケジューラ
      // -------------------------------------------------------------------------

      /** 描画要求を dirty フラグへ立て、1 フレーム最大 1 回の flush を予約する */
      markDirty(flags) {
        Object.assign(this._dirty, flags);
        if (!this._frame) this._frame = requestAnimationFrame(() => this._flush());
      }

      _flush() {
        this._frame = 0;
        const d = this._dirty;
        this._dirty = { dom: false, overlay: false, inspector: false };
        if (d.dom && this.selected) this.selected.renderToDom();
        if (d.overlay) this._syncOverlay();
        if (d.inspector) this._renderInspector();
      }

      /** 保留中の描画を同期的に確定させる (保存前の DOM 読出しや、即時反映が要る操作で使用) */
      flushNow() {
        if (this._frame) { cancelAnimationFrame(this._frame); this._frame = 0; }
        this._flush();
      }

      /** 全ラベルの状態を実 DOM へ反映 (Undo/読込時の一括同期) */
      renderAllToDom() {
        for (const s of this.labels) s.renderToDom();
      }

      // -------------------------------------------------------------------------
      // Undo 履歴 (全ラベルのスナップショット)
      // -------------------------------------------------------------------------

      pushHistory() {
        this.history.push(this.labels.map((s) => s.snapshot()));
        if (this.history.length > CONFIG.historyLimit) this.history.shift();
        this.updateToolbar();
      }

      undo() {
        if (!this.history.length) return;
        const snap = this.history.pop();
        this.labels.forEach((s, i) => s.apply(snap[i]));
        this.renderAllToDom();
        this.markDirty({ overlay: true, inspector: true });
        this.flushNow();
        this.updateToolbar();
      }

      updateToolbar() {
        this.dom.btnUndo.disabled = this.history.length === 0;
        this.dom.btnReset.disabled = !this.svg;
        this.dom.btnSave.disabled = !this.svg;
      }

      // -------------------------------------------------------------------------
      // オーバーレイ (ハンドル) 描画 — 構造変化時のみ再構築、通常は座標更新
      // -------------------------------------------------------------------------

      handleSize() {
        // ズームに依らず一定の見かけサイズになるよう SVG 単位を補正
        return CONFIG.handleScreenRadius / this.zoom;
      }

      /** ハンドル構成 (選択ラベル・表示状態・頂点数) を表すシグネチャ */
      _overlaySignature() {
        const s = this.selected;
        if (!s || !this.overlay || !s.leaderVisible || !s.leaderPts.length) return "none";
        return `${this.labels.indexOf(s)}|${s.leaderPts.length}`;
      }

      _syncOverlay() {
        const sig = this._overlaySignature();
        if (sig !== this._overlaySig) {
          this._buildOverlay();
          this._overlaySig = sig;
        } else {
          this._positionHandles();
        }
      }

      /** ハンドル円を作り直す (頂点数・選択が変わった時だけ呼ばれる) */
      _buildOverlay() {
        if (this.overlay) this.overlay.replaceChildren();
        this._handles = [];
        const s = this.selected;
        if (!s || !this.overlay) return;
        if (!(s.leaderVisible && s.leaderPts.length)) return;
        const r = this.handleSize();
        const last = s.leaderPts.length - 1;
        s.leaderPts.forEach((p, i) => {
          // 先頭=アンカー: 橙, 末尾=端点: 緑, 中間: 青
          const color = i === 0 ? "#ffb84c" : i === last ? "#57c878" : "#4c9aff";
          const c = this._circle(p.x, p.y, r, color);
          // 円側アンカー (i===0) はスライス中心角に固定 → ドラッグ不可。端点/曲げ点のみ可動。
          if (i === 0) {
            c.style.cursor = "not-allowed";
          } else {
            c.style.cursor = "move";
            c.addEventListener("pointerdown", (e) => this.startLeaderDrag(e, s, i));
          }
          this.overlay.appendChild(c);
          this._handles.push(c);
        });
      }

      /** 既存ハンドル円の cx/cy (+ズーム時の r/stroke) だけを更新 */
      _positionHandles() {
        const s = this.selected;
        if (!s || !this._handles.length) return;
        const r = this.handleSize();
        const sw = 1 / this.zoom;
        s.leaderPts.forEach((p, i) => {
          const c = this._handles[i];
          if (!c) return;
          c.setAttribute("cx", p.x);
          c.setAttribute("cy", p.y);
          c.setAttribute("r", r);
          c.setAttribute("stroke-width", sw);
        });
      }

      _circle(x, y, r, color) {
        return createSvgEl("circle", {
          cx: x, cy: y, r, fill: color,
          stroke: "#1e1f22", "stroke-width": 1 / this.zoom, "data-editor": "1",
        });
      }

      // -------------------------------------------------------------------------
      // ドラッグ操作
      // -------------------------------------------------------------------------

      /** ドラッグの定型処理: pointermove/up を配線し、初回の実移動時に一度だけ
       *  pushHistory する。onMove(dx, dy) には開始点からの累積移動量を渡す。 */
      onDrag(evt, onMove) {
        // 逆 CTM はドラッグ中ほぼ不変 (ズーム/スクロールしない) なので開始時に1回だけ取得
        const inv = this.svg.getScreenCTM().inverse();
        const start = this.toSvgPoint(evt, inv);
        let pushed = false;
        const move = (e) => {
          const p = this.toSvgPoint(e, inv);
          const dx = p.x - start.x;
          const dy = p.y - start.y;
          if (!pushed && (dx || dy)) { this.pushHistory(); pushed = true; }
          onMove(dx, dy);
        };
        const up = () => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          window.removeEventListener("pointercancel", up);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
        window.addEventListener("pointercancel", up);
      }

      startTextDrag(evt, s) {
        evt.preventDefault();
        evt.stopPropagation();
        this.selectLabel(s);
        const txStart = { ...s.textTx };
        // ドラッグ開始時の leader 状態 (円外で元から leader を持つ場合の追従/復元に使用)
        const startPts = s.leaderPts.map((p) => ({ ...p }));
        // bbox は transform 非依存 (= ドラッグ中不変) なので開始時に1回だけ取得し reflow を避ける
        const bbox = safeGetBBox(s.text, null);

        this.onDrag(evt, (dx, dy) => {
          s.textTx = { x: txStart.x + dx, y: txStart.y + dy };
          // startPts 基準でアンカー/曲げ点を保持しつつ端点を毎フレーム外枠へ再スナップ
          this.followLeaderAfterMove(s, bbox, startPts);
          this.markDirty({ dom: true, overlay: true, inspector: true });
        });
      }

      startLeaderDrag(evt, s, index) {
        evt.preventDefault();
        evt.stopPropagation();
        this.selectLabel(s);
        s._auto = false; // 手動で頂点を動かしたら以後は位置駆動で上書きしない
        const ptStart = { ...s.leaderPts[index] };

        this.onDrag(evt, (dx, dy) => {
          s.leaderPts[index] = { x: ptStart.x + dx, y: ptStart.y + dy };
          this.markDirty({ dom: true, overlay: true });
        });
      }

      // -------------------------------------------------------------------------
      // 選択 & インスペクタ
      // -------------------------------------------------------------------------

      selectLabel(s) {
        if (this.selected === s) return;
        if (this.selected) this.selected.g.classList.remove("is-selected");
        this.selected = s;
        if (s) s.g.classList.add("is-selected");
        this.markDirty({ overlay: true, inspector: true });
        this.flushNow();
      }

      /** leader 行 (無: 追加ボタン / 有: 表示切替・曲げ点・削除) の HTML */
      _leaderRowsHtml(s) {
        if (s.leaderPts.length < 2) {
          // リーダー無し: 後付け追加ボタン
          return `
    <div class="row">
      <label>leader</label>
      <div class="toggle">
        <button data-act="leaderAdd">リーダー線を追加</button>
      </div>
    </div>`;
        }
        // リーダー有り: 表示切替 + 曲げ点(最大1つ) + 削除
        const hasBend = s.leaderPts.length >= 3;
        return `
    <div class="row">
      <label>leader</label>
      <div class="toggle">
        <button data-act="leaderOn" class="${onClass(s.leaderVisible)}">表示</button>
        <button data-act="leaderOff" class="${onClass(!s.leaderVisible)}">非表示</button>
      </div>
    </div>
    <div class="row">
      <label>曲げ点</label>
      <div class="toggle">
        ${hasBend
            ? `<button data-act="bendRemove">曲げ点を削除</button>`
            : `<button data-act="bendAdd">曲げ点を追加</button>`}
        <button data-act="leaderDelete">リーダー線を削除</button>
      </div>
    </div>`;
      }

      /** 選択中ラベルのインスペクタ本体 HTML */
      _inspectorBodyHtml(s) {
        return `
    <div class="name">${escapeHtml(s.name)}</div>
    <div class="row coords">${formatCoords(s.textTx)}</div>
    <div class="row">
      <label>行数</label>
      <div class="toggle">
        <button data-act="lines1" class="${onClass(s.lineCount < 2)}">1行</button>
        <button data-act="lines2" class="${onClass(s.lineCount >= 2)}">2行</button>
      </div>
    </div>
    <div class="row">
      <label>長体</label>
      <input type="range" id="scaleRange" min="${CONFIG.condenseMin}" max="1" step="${CONFIG.condenseStep}" value="${s.nameScaleX}">
      <span class="coords" id="scaleVal" style="width:42px;text-align:right">${Math.round(s.nameScaleX * 100)}%</span>
    </div>
    ${this._leaderRowsHtml(s)}
    <div class="row">
      <label>文字色</label>
      <div class="toggle">
        <button data-act="insideOff" class="${onClass(s.fill !== WHITE)}">通常(黒)</button>
        <button data-act="insideOn" class="${onClass(s.fill === WHITE)}">白(内側)</button>
      </div>
    </div>
    <div class="row" style="gap:6px">
      <button data-act="resetOne" style="flex:1">このラベルをリセット</button>
    </div>${INSPECTOR_HINT_HTML}`;
      }

      /** インスペクタの構造を表すシグネチャ (座標 dx/dy は含めない = 構造再構築の対象外) */
      _inspectorSignature() {
        const s = this.selected;
        if (!s) return "none";
        return [this.labels.indexOf(s), s.leaderPts.length, s.leaderVisible, s.fill === WHITE, s.lineCount, s.nameScaleX].join("|");
      }

      /** 構造シグネチャが変わった時だけパネルを作り直し、毎回 座標表示だけ更新する */
      _renderInspector() {
        const sig = this._inspectorSignature();
        if (sig !== this._inspSig) {
          this._inspSig = sig;
          this._buildInspector();
        }
        this._updateInspectorReadout();
      }

      _buildInspector() {
        const s = this.selected;
        if (!s) {
          this.dom.inspectorBody.innerHTML = INSPECTOR_EMPTY_HTML;
          this._inspCoordEl = null;
          return;
        }
        const box = document.createElement("div");
        box.innerHTML = this._inspectorBodyHtml(s);
        box.querySelectorAll("button[data-act]").forEach((btn) => {
          btn.addEventListener("click", () => this.inspectorAction(btn.getAttribute("data-act")));
        });
        // 長体スライダ: ドラッグ中はライブ反映し、操作開始時に 1 度だけ履歴へ積む。
        // インスペクタは再構築しない (markDirty inspector しない) のでドラッグが途切れない。
        const range = box.querySelector("#scaleRange");
        if (range) {
          const valEl = box.querySelector("#scaleVal");
          let pushed = false;
          const begin = () => { pushed = false; };
          range.addEventListener("pointerdown", begin);
          range.addEventListener("keydown", begin);
          range.addEventListener("input", () => {
            if (!this.selected) return;
            if (!pushed) { this.pushHistory(); pushed = true; }
            const v = parseFloat(range.value);
            this.selected.nameScaleX = v;
            if (valEl) valEl.textContent = `${Math.round(v * 100)}%`;
            this.markDirty({ dom: true });
          });
        }
        this.dom.inspectorBody.replaceChildren(box);
        this._inspCoordEl = box.querySelector(".coords");
      }

      /** ドラッグ中に毎フレーム変わる dx/dy 表示だけを軽量に更新 */
      _updateInspectorReadout() {
        const s = this.selected;
        if (!s || !this._inspCoordEl) return;
        this._inspCoordEl.textContent = formatCoords(s.textTx);
      }

      inspectorAction(act) {
        const s = this.selected;
        const a = INSPECTOR_ACTIONS[act];
        if (!s || !a || !a.guard(s)) return;
        this.pushHistory();
        a.run(this, s);
        this.markDirty({ dom: true, overlay: true, inspector: true });
      }

      nudge(dx, dy) {
        const s = this.selected;
        if (!s) return;
        this.pushHistory();
        s.textTx = { x: s.textTx.x + dx, y: s.textTx.y + dy };
        // 端点を外枠へ再スナップ。円周を跨いだ場合の自動生成/削除も内包。
        this.followLeaderAfterMove(s, safeGetBBox(s.text, null));
        this.markDirty({ dom: true, overlay: true, inspector: true });
      }

      // -------------------------------------------------------------------------
      // SVG 読込 & セットアップ (メモリ上の content を直接インライン挿入)
      // -------------------------------------------------------------------------

      async load(item) {
        if (!item || typeof item.content !== "string") return;
        const seq = ++this._loadSeq; // この呼び出しの世代 (後勝ち判定用)
        this.name = item.name;
        this.currentId = item.id;
        this.history = [];
        this.selected = null;
        this.zoom = 1;
        this._pie = null;
        this._leaderStyle = null;
        this._sliceByName = null;
        this._sliceAnchor = null;
        // 別ファイルへ切替えるので構造シグネチャ/参照キャッシュをリセット
        this._inspSig = null;
        this._inspCoordEl = null;
        this._overlaySig = null;
        this._handles = [];

        // 接続前にサニタイズした <svg> を取り込んでインライン挿入 (フォント込みで描画)
        const clean = sanitizeSvg(item.content);
        if (!clean) {
          this.dom.canvas.replaceChildren();
          this.setStatus(`${item.name}: SVG を解釈できませんでした`, "err");
          this.svg = null;
          this.updateToolbar();
          return;
        }
        this.dom.canvas.replaceChildren(document.importNode(clean, true));
        const svg = this.dom.canvas.querySelector("svg");
        this.svg = svg;

        // ベースサイズを viewBox から取得
        const vb = (svg.getAttribute("viewBox") || `0 0 ${CONFIG.defaultViewBox.w} ${CONFIG.defaultViewBox.h}`).split(/\s+/).map(Number);
        this.baseW = vb[2] || CONFIG.defaultViewBox.w;
        this.baseH = vb[3] || CONFIG.defaultViewBox.h;
        this.applyZoom();

        // 埋め込みフォントの読込を待ってから getBBox (正確なヒット領域のため)
        try {
          await document.fonts.ready;
        } catch {
          /* fonts API 非対応でも続行 */
        }
        // await 中に別ファイルが読み込まれていたら後勝ち。古い継続は中断する。
        if (seq !== this._loadSeq) return;

        // 各ラベルにヒット領域を付与 + 状態構築
        this.labels = [];
        const labelGroups = svg.querySelectorAll("#labels > g.label");
        labelGroups.forEach((g) => {
          const s = new LabelState(g, this);
          this.labels.push(s);
          this.attachHitArea(s);
        });

        // ハンドル用オーバーレイ (最前面)
        const overlay = createSvgEl("g", { id: "editor-overlay", "data-editor": "1" });
        svg.appendChild(overlay);
        this.overlay = overlay;

        // 背景クリックで選択解除
        svg.addEventListener("pointerdown", (e) => {
          if (e.target === svg || e.target.closest("#slices")) this.selectLabel(null);
        });

        this.markDirty({ overlay: true, inspector: true });
        this.flushNow();
        this.updateToolbar();
        this.highlightActiveInList();
        this.setStatus(`${item.name}  (ラベル ${this.labels.length} 個)`);
      }

      /** ラベルにドラッグ用の透明ヒット矩形を追加 */
      attachHitArea(s) {
        const bbox = safeGetBBox(s.text);
        const pad = CONFIG.hitPadding;
        const rect = createSvgEl("rect", {
          class: "label-hit", "data-editor-hit": "1",
          x: bbox.x - pad, y: bbox.y - pad,
          width: bbox.width + pad * 2, height: bbox.height + pad * 2,
        });
        s._hitRect = rect;
        // text と同じ transform を適用して追従させる
        s.syncHit();
        rect.addEventListener("pointerdown", (e) => this.startTextDrag(e, s));
        // 最前面 (glyph の隙間も含めて bbox 全体を掴めるよう text の上に重ねる)
        s.g.appendChild(rect);
      }

      // -------------------------------------------------------------------------
      // ズーム
      // -------------------------------------------------------------------------

      applyZoom() {
        if (!this.svg) return;
        this.svg.setAttribute("width", this.baseW * this.zoom);
        this.svg.setAttribute("height", this.baseH * this.zoom);
      }

      setZoom(z) {
        const prev = this.zoom;
        z = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, z));
        if (z === prev) return;
        // 表示中心を保ったまま拡縮 (左上基準だと中心がずれて見づらいため)
        const pane = this.dom.canvas.parentElement; // #canvasPane (スクロール容器)
        const r = z / prev;
        const cx = pane.scrollLeft + pane.clientWidth / 2;
        const cy = pane.scrollTop + pane.clientHeight / 2;
        this.zoom = z;
        this.applyZoom();
        pane.scrollLeft = cx * r - pane.clientWidth / 2;
        pane.scrollTop = cy * r - pane.clientHeight / 2;
        // ハンドルの見かけサイズをズームに追従 (構造不変なので座標/サイズ更新で済む)
        this.markDirty({ overlay: true });
        this.flushNow();
      }

      // -------------------------------------------------------------------------
      // 保存 (baking → ネイティブ保存ダイアログ)
      // -------------------------------------------------------------------------

      async save() {
        if (!this.svg) return;
        // 保留中の描画を確定させてから DOM を読む
        this.flushNow();
        const out = this.bakeSvg();
        const markSaved = () => {
          const it = this.items.find((i) => i.id === this.currentId);
          if (it) it.edited = true;
          this.renderList();
          this.highlightActiveInList();
        };
        if (hasFsAccess()) {
          this.setStatus("保存先を選択してください…");
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: this.name || "edited.svg",
              types: SVG_PICKER_TYPES,
            });
            const w = await handle.createWritable();
            await w.write(out);
            await w.close();
            this.setStatus(`保存しました → ${handle.name}`, "ok");
            markSaved();
          } catch (e) {
            if (e && e.name === "AbortError") this.setStatus("保存をキャンセルしました");
            else this.setStatus(`保存に失敗しました: ${e}`, "err");
          }
        } else {
          // 非対応ブラウザ: Blob をダウンロード (ブラウザの保存先へ)
          this.downloadSvg(out, this.name || "edited.svg");
          this.setStatus("ダウンロードフォルダに保存しました", "ok");
          markSaved();
        }
      }

      /** FS Access API 非対応時のフォールバック保存 (Blob ダウンロード) */
      downloadSvg(text, name) {
        const blob = new Blob([text], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = /\.svg$/i.test(name) ? name : `${name}.svg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      /** 編集を恒久座標へ焼き込み、エディタ専用要素を除去したクリーン SVG 文字列を返す */
      bakeSvg() {
        const clone = this.svg.cloneNode(true);

        // エディタ専用要素を除去
        clone.querySelectorAll("[data-editor], [data-editor-hit]").forEach((el) => el.remove());
        // 選択ハイライト等の編集専用クラスを除去
        clone.querySelectorAll(".is-selected").forEach((el) => el.classList.remove("is-selected"));

        // 表示用に付けた width/height (ズーム) を元サイズへ戻す
        clone.setAttribute("width", `${this.baseW}px`);
        clone.setAttribute("height", `${this.baseH}px`);

        // 各ラベル: text transform を x/y へ焼き込み、非表示 leader を除去
        clone.querySelectorAll("#labels > g.label").forEach((g) => {
          const text = g.querySelector("text");
          if (text) {
            const t = parseTranslate(text.getAttribute("transform"));
            if (t.x || t.y) {
              const x = parseFloat(text.getAttribute("x") || "0") + t.x;
              const y = parseFloat(text.getAttribute("y") || "0") + t.y;
              text.setAttribute("x", round(x));
              text.setAttribute("y", round(y));
              text.querySelectorAll("tspan").forEach((ts) => {
                if (ts.hasAttribute("x")) ts.setAttribute("x", round(parseFloat(ts.getAttribute("x")) + t.x));
                // dy は相対値なので不変
              });
              text.removeAttribute("transform");
            }
          }
          const path = g.querySelector("path");
          if (path) {
            if (path.style.display === "none") {
              path.remove();
            } else {
              // 表示用に付けた display だけ消す。入力 SVG 由来の他の inline style は保持。
              path.style.removeProperty("display");
              if (!path.getAttribute("style")) path.removeAttribute("style");
            }
          }
        });

        const xml = new XMLSerializer().serializeToString(clone);
        return `<?xml version="1.0" encoding="UTF-8"?>\n${xml}`;
      }

      // -------------------------------------------------------------------------
      // ファイル一覧 (メモリ保持) & 開く
      // -------------------------------------------------------------------------

      async openFiles() {
        this.setStatus("ファイルを選択してください…");
        let files = [];
        if (hasFsAccess()) {
          let handles;
          try {
            handles = await window.showOpenFilePicker({ multiple: true, types: SVG_PICKER_TYPES });
          } catch (e) {
            if (e && e.name === "AbortError") { this.setStatus("ファイルが選択されませんでした"); return; }
            this.setStatus(`読込に失敗しました: ${e}`, "err");
            return;
          }
          for (const h of handles) {
            try {
              const file = await h.getFile();
              files.push({ name: file.name, content: await file.text() });
            } catch (e) {
              files.push({ name: h.name || "(no name)", content: "", error: String(e) });
            }
          }
        } else {
          files = await this.pickFilesFallback();
        }
        if (!files || !files.length) {
          this.setStatus("ファイルが選択されませんでした");
          return;
        }
        // 同名でも別ファイルとして区別したいので name で重複排除せず、各々へ一意 id を振る。
        const added = files.map((f) => {
          const it = { ...f, id: ++this._itemSeq, edited: false };
          this.items.push(it);
          return it;
        });
        this.renderList();
        await this.load(added[0]);
      }

      /** FS Access API 非対応時のフォールバック: <input type=file> で複数選択 */
      pickFilesFallback() {
        return new Promise((resolve) => {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = ".svg,image/svg+xml";
          input.multiple = true;
          input.style.display = "none";
          let done = false;
          const finish = async () => {
            if (done) return;
            done = true;
            const out = [];
            for (const file of [...(input.files || [])]) {
              out.push({ name: file.name, content: await file.text() });
            }
            input.remove();
            resolve(out);
          };
          input.addEventListener("change", finish);
          // キャンセル検知 (focus が戻り files が空なら空配列で解決)
          window.addEventListener("focus", () => setTimeout(() => {
            if (!done && (!input.files || !input.files.length)) { done = true; input.remove(); resolve([]); }
          }, 500), { once: true });
          document.body.appendChild(input);
          input.click();
        });
      }

      renderList() {
        this.dom.list.replaceChildren();
        if (!this.items.length) {
          const e = document.createElement("div");
          e.className = "empty";
          e.innerHTML = EMPTY_LIST_HTML;
          this.dom.list.appendChild(e);
          return;
        }
        for (const it of this.items) {
          const div = document.createElement("div");
          div.className = "item" + (it.id === this.currentId ? " active" : "");
          div.innerHTML = `${escapeHtml(it.name.replace(/\.svg$/, ""))}${it.edited ? '<span class="edited" title="保存済み">●</span>' : ""}`;
          div.addEventListener("click", () => this.load(it));
          this.dom.list.appendChild(div);
        }
      }

      highlightActiveInList() {
        const items = [...this.dom.list.querySelectorAll(".item")];
        const idx = this.items.findIndex((it) => it.id === this.currentId);
        items.forEach((el, i) => el.classList.toggle("active", i === idx));
      }

      // -------------------------------------------------------------------------
      // イベント配線
      // -------------------------------------------------------------------------

      bindEvents() {
        this.dom.btnOpen.addEventListener("click", () => this.openFiles());
        this.dom.btnSave.addEventListener("click", () => this.save());
        this.dom.btnUndo.addEventListener("click", () => this.undo());
        this.dom.btnReset.addEventListener("click", () => {
          const it = this.items.find((i) => i.id === this.currentId);
          if (it) this.load(it);
        });
        this.dom.btnZoomIn.addEventListener("click", () => this.setZoom(this.zoom * CONFIG.zoomStep));
        this.dom.btnZoomOut.addEventListener("click", () => this.setZoom(this.zoom / CONFIG.zoomStep));

        window.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
            e.preventDefault();
            this.undo();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
            e.preventDefault();
            this.save();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") {
            e.preventDefault();
            this.openFiles();
            return;
          }
          if (e.key === "Escape") {
            this.selectLabel(null);
            return;
          }
          // 入力欄/スライダ(長体)にフォーカス中は矢印をそのコントロールに委ね、ラベル移動はしない
          const ae = document.activeElement;
          if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)) return;
          if (!this.selected) return;
          const step = e.shiftKey ? CONFIG.nudgeStepFast : CONFIG.nudgeStep;
          const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
          if (map[e.key]) {
            e.preventDefault();
            this.nudge(map[e.key][0], map[e.key][1]);
          }
        });
      }
    }

    // ---------------------------------------------------------------------------
    // 起動
    // ---------------------------------------------------------------------------

    const editor = new Editor(dom);
    editor.bindEvents();
    // E2E テスト用フック (本番動作には無害)。Playwright から editor を操作するため公開。
    window.__editor = editor;

    // ローカルサーバから配信され、即操作可能。Edge(Chromium) なら FS Access API でネイティブ I/O。
    if (hasFsAccess()) {
      editor.setStatus(STATUS_READY);
    } else {
      editor.setStatus("簡易モード: 開く=ファイル選択 / 保存=ダウンロード (Edge 推奨)");
    }

    // 窓/タブを閉じたらローカルサーバへ終了を通知 (常駐プロセスを残さない)。
    window.addEventListener("pagehide", () => {
      try { navigator.sendBeacon("/quit"); } catch { /* 失敗してもプロセス監視側で終了する */ }
    });

    // 生存ハートビート。Edge アプリ窓ではプロセス監視で終了するが、既定ブラウザ(フォールバック)
    // 経路にはプロセスハンドルが無く、終了契機が pagehide ビーコンのみになる。ビーコン不達/タブ
    // クラッシュ時にサーバ側 watchdog が自動終了できるよう、定期的に生存を知らせる。
    setInterval(() => { fetch("/ping", { method: "POST", keepalive: true }).catch(() => { }); }, 10000);
  </script>
</body>

</html>
