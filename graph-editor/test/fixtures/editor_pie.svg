<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="550" height="400">
  <!-- E2E 用の最小フィクスチャ。getPieGeometry が最初の slice の d から cx,cy,r を、
       sliceMidAnchor が楔形 (M…L…A) から中心角リム点を取得できる構造。
       埋め込みフォントは不要 — 不変条件はテスト時の実 getBBox に対して判定するため。
       パイ中心 (275,200) / 半径 120。 -->
  <g id="slices">
    <g class="slice" data-name="Alpha">
      <path d="M275,200 L275,80 A120,120 0 0 1 395,200 Z" fill="#4e79a7"/>
    </g>
    <g class="slice" data-name="Beta">
      <path d="M275,200 L395,200 A120,120 0 0 1 155,200 Z" fill="#f28e2b"/>
    </g>
  </g>
  <g id="labels">
    <g class="label" data-name="Alpha" data-line-count="1" data-percent="50">
      <path d="M360,115 L470,60" fill="none" stroke="#111111" stroke-width="1"/>
      <text x="470" y="60" font-size="13" fill="#111111" dominant-baseline="middle"><tspan x="470" dy="0em">Alpha 50%</tspan></text>
    </g>
    <!-- Beta は引出線なし・円内に配置: 円外へ動かすと自動生成、円内へ戻すと自動削除を検証する。 -->
    <g class="label" data-name="Beta" data-line-count="1" data-percent="50">
      <text x="250" y="205" font-size="13" fill="#111111" dominant-baseline="middle"><tspan x="250" dy="0em">Beta</tspan></text>
    </g>
  </g>
</svg>
