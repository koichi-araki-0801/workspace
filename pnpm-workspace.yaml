packages:
  - editor/shared
  - editor/server
  - editor/web
  - pie-chart

# pnpm run/exec 前の依存整合チェックで自動 install を走らせない。
# オフライン環境では prune/再 install がネットに出て失敗するため無効化する。
# （install 済みの node_modules はストアへのハードリンクで自己完結している）
verifyDepsBeforeRun: false

# pnpm はビルドスクリプトを既定でブロックする。許可するパッケージを列挙（pnpm 11 の allowBuilds）
allowBuilds:
  esbuild: true
  # @vueuse 等の推移的依存。postinstall で Vue 2/3 モード切替を行うためビルド許可が必要
  vue-demi: true
  "@vivliostyle/cli": true
  "@biomejs/biome": true
  '@scarf/scarf': false
  msnodesqlv8: false

# 推移依存の脆弱な版を底上げする。
# dompurify: @vivliostyle/cli 11.4.0 が 3.4.13 を版固定しているため。
# trim: remark 系の古い推移依存。出力は変わらず audit の high が消える。
overrides:
  dompurify: ">=3.4.17"
  trim: ">=0.0.3"
