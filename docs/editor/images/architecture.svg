<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <!-- Editor 全体アーキテクチャ図（正典）。変更後は docs/_build/svg2png.py で PNG を再生成する。 -->
  <style>
    text { font-family: 'BIZ UDPGothic', sans-serif; fill: #20242C; }
    .mono { font-family: 'BIZ UDGothic', monospace; }
    .title { font-size: 21px; font-weight: bold; }
    .item { font-size: 16px; }
    .small { font-size: 14px; fill: #606874; }
    .label { font-size: 14px; font-weight: bold; fill: #1F5C99; }
    .white { fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #1F5C99; stroke-width: 2; }
    .panel { fill: #F4F6F8; stroke: #DCE3EA; stroke-width: 1.5; }
    .accent { fill: #1F5C99; }
    .edge { stroke: #1F5C99; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dep { stroke: #606874; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow-m); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5C99"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#606874"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#FFFFFF"/>

  <!-- web/ -->
  <rect class="box" x="50" y="40" width="470" height="330" rx="8"/>
  <text class="title" x="80" y="80"><tspan class="mono">web/</tspan>　Vue 3 + Vite + Pinia</text>
  <text class="item" x="80" y="130">・GrapesJS 編集（<tspan class="mono">jinjaMask</tspan> で Jinja タグを保護）</text>
  <text class="item" x="80" y="166">・Jinja 描画は隔離レンダーホスト iframe の中だけ</text>
  <text class="item" x="80" y="202">・vivliostyle プレビューホスト iframe / PDF 要求</text>
  <text class="item" x="80" y="238">・認証（login / パスワード変更）と確定保存の申請</text>
  <rect class="accent" x="80" y="272" width="410" height="66" rx="6"/>
  <text class="item white" x="285" y="299" text-anchor="middle"><tspan class="mono">api/repositories.ts</tspan></text>
  <text class="small white" x="285" y="324" text-anchor="middle">local ⇄ rest の唯一の差し替え点（1 オブジェクト）</text>

  <!-- server/ -->
  <rect class="box" x="680" y="40" width="470" height="330" rx="8"/>
  <text class="title" x="710" y="80"><tspan class="mono">server/</tspan>　Fastify</text>
  <text class="item" x="710" y="130">・REST API（<tspan class="mono">/api/*</tspan>・OpenAPI <tspan class="mono">/api/docs</tspan>）</text>
  <text class="item" x="710" y="166">・vivliostyle CLI（PDF / preview 中継・egress 遮断）</text>
  <text class="item" x="710" y="202">・申請 → 承認ゲート（<tspan class="mono">applyConfirmedSave</tspan>）</text>
  <text class="item" x="710" y="238">・sproc ゲートウェイ 7 本 + セッション認証</text>
  <text class="small" x="710" y="274">rest モードで SQL Server 接続（実装済・本番未デプロイ）</text>
  <text class="small" x="710" y="300">local モードは DB 不要（fixtures + ファイル）</text>

  <!-- local モード -->
  <rect class="panel" x="50" y="420" width="350" height="90" rx="8"/>
  <text class="item" x="225" y="455" text-anchor="middle">local モード（既定）</text>
  <text class="small" x="225" y="482" text-anchor="middle">fixtures + localStorage 実装</text>

  <!-- editor-data -->
  <rect class="panel" x="620" y="420" width="200" height="90" rx="8"/>
  <text class="item" x="720" y="455" text-anchor="middle"><tspan class="mono">editor-data/</tspan></text>
  <text class="small" x="720" y="482" text-anchor="middle">テンプレ実体 + git（dataRoot）</text>

  <!-- SQL Server -->
  <rect class="box" x="885" y="420" width="300" height="90" rx="8"/>
  <text class="item" x="1035" y="455" text-anchor="middle">SQL Server 2012（usrap/ug01）</text>
  <text class="small" x="1035" y="482" text-anchor="middle">7 ゲートウェイ sproc 経由</text>

  <!-- shared/ -->
  <rect class="box" x="300" y="550" width="600" height="90" rx="8"/>
  <text class="item" x="600" y="584" text-anchor="middle"><tspan class="mono" font-weight="bold">shared/（@editor/shared）</tspan>　型の真実源</text>
  <text class="small" x="600" y="612" text-anchor="middle">Repository 契約・Zod スキーマ・Result / AppError</text>

  <!-- エッジ -->
  <line class="edge" x1="522" y1="320" x2="674" y2="320"/>
  <text class="label" x="600" y="286" text-anchor="middle">rest モード</text>
  <text class="label" x="600" y="304" text-anchor="middle">/api（同一契約）</text>
  <line class="edge" x1="225" y1="372" x2="225" y2="414"/>
  <line class="edge" x1="720" y1="372" x2="720" y2="414"/>
  <text class="small" x="732" y="400">読み書き</text>
  <line class="edge" x1="1035" y1="372" x2="1035" y2="414"/>
  <text class="small" x="1047" y="400">rest 時</text>
  <line class="dep" x1="470" y1="372" x2="470" y2="544"/>
  <line class="dep" x1="870" y1="372" x2="870" y2="544"/>
  <text class="small" x="670" y="538" text-anchor="middle">契約（型）に依存。実装は差し替え可</text>
</svg>
