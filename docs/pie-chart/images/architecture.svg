<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <!-- pie-chart レンダリングパイプライン図（正典）。変更後は docs/_build/svg2png.py で PNG を再生成する。 -->
  <style>
    text { font-family: 'BIZ UDPGothic', sans-serif; fill: #20242C; }
    .mono { font-family: 'BIZ UDGothic', monospace; }
    .name { font-size: 18px; font-weight: bold; }
    .item { font-size: 16px; }
    .small { font-size: 14px; fill: #606874; }
    .head { font-size: 19px; font-weight: bold; }
    .box { fill: #FFFFFF; stroke: #1F5C99; stroke-width: 2; }
    .panel { fill: #F4F6F8; stroke: #DCE3EA; stroke-width: 1.5; }
    .sub { fill: #FFFFFF; stroke: #DCE3EA; stroke-width: 1.5; }
    .edge { stroke: #1F5C99; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5C99"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>

  <!-- 入力 3 系統 -->
  <rect class="panel" x="60" y="40" width="310" height="90" rx="8"/>
  <text class="name" x="215" y="76" text-anchor="middle">JSON / samples.json</text>
  <text class="small" x="215" y="104" text-anchor="middle">配列 {name, value} を直接読込</text>

  <rect class="panel" x="445" y="40" width="310" height="90" rx="8"/>
  <text class="name" x="600" y="76" text-anchor="middle">Excel（.xlsx）</text>
  <text class="small mono" x="600" y="104" text-anchor="middle">input/load.ts / exceljs</text>

  <rect class="panel" x="830" y="40" width="310" height="90" rx="8"/>
  <text class="name" x="985" y="76" text-anchor="middle">DB（SQL Server）</text>
  <text class="small mono" x="985" y="104" text-anchor="middle">input/db.ts / msnodesqlv8</text>

  <!-- 正規化 -->
  <rect class="box" x="340" y="180" width="520" height="72" rx="8"/>
  <text class="item" x="600" y="210" text-anchor="middle"><tspan class="mono" font-weight="bold">input/load.ts</tspan>　resolveInputData / normalizeInputItems</text>
  <text class="small" x="600" y="236" text-anchor="middle">→ Item[] {name, value} へ正規化（値降順の整列は pipeline 側）</text>

  <!-- レンダラ本体 -->
  <rect class="box" x="100" y="300" width="1000" height="230" rx="8"/>
  <text class="head" x="130" y="336"><tspan class="mono">renderPdfStylePieToSvg</tspan>（svg_export/pipeline.ts）　カスケード配置・候補選択・emit 修復</text>

  <rect class="sub" x="130" y="360" width="300" height="64" rx="6"/>
  <text class="name mono" x="150" y="386">config.ts</text>
  <text class="small" x="150" y="410">寸法・スケール・配色</text>

  <rect class="sub" x="450" y="360" width="300" height="64" rx="6"/>
  <text class="name mono" x="470" y="386">layout/diagnostics.ts</text>
  <text class="small" x="470" y="410">モード判定・per-item マーカー</text>

  <rect class="sub" x="770" y="360" width="300" height="64" rx="6"/>
  <text class="name mono" x="790" y="386">layout/placement.ts</text>
  <text class="small" x="790" y="410">角度ゾーン別配置 10 種 + leader path</text>

  <rect class="sub" x="130" y="444" width="300" height="64" rx="6"/>
  <text class="name mono" x="150" y="470">svg_export/mode_passes.ts</text>
  <text class="small" x="150" y="494">左列 / top-band / 右上逃がし</text>

  <rect class="sub" x="450" y="444" width="300" height="64" rx="6"/>
  <text class="name mono" x="470" y="470">svg_export/emit_repair.ts</text>
  <text class="small" x="470" y="494">修復パス列・採点・do-no-harm</text>

  <rect class="sub" x="770" y="444" width="300" height="64" rx="6"/>
  <text class="name mono" x="790" y="470">rendering.ts / font.ts</text>
  <text class="small" x="790" y="494">SVG 文字列生成・WOFF2 サブセット埋込</text>

  <!-- 出力 -->
  <rect class="panel" x="290" y="580" width="620" height="72" rx="8"/>
  <text class="name" x="600" y="610" text-anchor="middle">決定的 SVG（同一入力 → 同一バイト列）</text>
  <text class="small" x="600" y="636" text-anchor="middle">out/svg_js　83 サンプルを out/_baseline と byte 比較・verify/svg.ts で独立検証</text>

  <!-- エッジ -->
  <line class="edge" x1="215" y1="132" x2="450" y2="174"/>
  <line class="edge" x1="600" y1="132" x2="600" y2="174"/>
  <line class="edge" x1="985" y1="132" x2="750" y2="174"/>
  <line class="edge" x1="600" y1="254" x2="600" y2="294"/>
  <line class="edge" x1="600" y1="532" x2="600" y2="574"/>

  <text class="small" x="600" y="672" text-anchor="middle">外部依存（exceljs / msnodesqlv8 / subset-font）は端の層に隔離。レンダリング層は依存ゼロ</text>
</svg>
