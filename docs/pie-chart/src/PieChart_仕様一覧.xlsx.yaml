out: PieChart_仕様一覧.xlsx
title: PieChart 仕様一覧（入出力 / CLI・設定 / テスト）
meta: "対象: 円グラフ SVG レンダラ PieChart ・ 版 1.0 ・ 出典: pie-chart/ 実装コード・テスト（DB なし）"
sheets:
  - name: 入出力定義
    columns:
      - { key: no,   label: "No",    width: 5,  align: center }
      - { key: io,   label: "区分",   width: 8,  align: center }
      - { key: name, label: "項目",   width: 18 }
      - { key: type, label: "型/形式", width: 22, mono: true }
      - { key: note, label: "説明",   width: 46, wrap: true }
    rows:
      - [1, "入力", "samples.json", "Record<string, {description, items}>", "内蔵87サンプル。各 items は Item 配列"]
      - [2, "入力", "Item.name", "string", "スライス名（凡例ラベル）"]
      - [3, "入力", "Item.value", "number", "スライス値。割合は内部で算出"]
      - [4, "入力", "JSONファイル", "Item[]（[{name, value}, ...]）", "--data-file で指定"]
      - [5, "入力", "JSON直渡し", "Item[]（CLI文字列）", "--data-json で直接指定"]
      - [6, "入力", "Excel(xlsx)", "2列固定（左=name, 右=value）", "--xlsx + --sheet + --range（例 A1:B11）"]
      - [7, "出力", "SVG文字列", "600×450px 固定", "スライスpath・ラベル・リーダー線・WOFF2埋込フォント"]
      - [8, "出力", "テキスト要素", "<text>（実テキスト）", "ラベルとパーセンテージは後から検索可能"]
      - [9, "出力", "リーダー線", "<path>（引出線）", "決定的シリアライズ（同一入力→同一バイト）"]
  - name: CLI・設定
    columns:
      - { key: no,    label: "No",     width: 5,  align: center }
      - { key: grp,   label: "区分",    width: 10 }
      - { key: key,   label: "コマンド/パラメータ", width: 22, mono: true }
      - { key: val,   label: "既定/値域", width: 14, mono: true }
      - { key: desc,  label: "説明",    width: 44, wrap: true }
    rows:
      - [1, "コマンド", "list", "", "サンプル一覧表示"]
      - [2, "コマンド", "one", "", "1件レンダリング"]
      - [3, "コマンド", "batch", "", "全件生成（out/）"]
      - [4, "オプション", "--sample", "", "サンプル名で選択"]
      - [5, "オプション", "--data-file", "", "JSONファイル指定"]
      - [6, "オプション", "--data-json", "", "JSON文字列を直渡し"]
      - [7, "オプション", "--xlsx / --sheet / --range", "", "Excel範囲入力（例 A1:B11）"]
      - [8, "オプション", "--font-weight", "400 | 700", "フォントウェイト切替"]
      - [9, "オプション", "--stroke-ratio", "number", "faux-bold のストローク調整"]
      - [10, "オプション", "--output-file / --output-dir", "", "出力先指定"]
      - [11, "設定", "svgWidthPx / svgHeightPx", "600 / 450", "SVG寸法（固定）"]
      - [12, "設定", "pieHeightRatio", "0.7", "直径 = 450 × 0.7 = 315px"]
      - [13, "設定", "baselineFontSize", "20", "基準フォントサイズ"]
      - [14, "設定", "fontSize", "40", "実描画。40 × 0.68 ≈ 27.2px"]
      - [15, "設定", "labelRadius", "1.19", "ラベル配置半径倍率"]
      - [16, "設定", "startangle", "90.0", "12時を0°に"]
      - [17, "設定", "minGap", "0.16", "ラベル最小間隔"]
      - [18, "設定", "smallSliceThreshold", "6.0", "小スライス判定（%）"]
      - [19, "設定", "denseCountThreshold", "9", "密判定のスライス数閾値"]
  - name: テスト仕様
    columns:
      - { key: no,     label: "No",       width: 5,  align: center }
      - { key: file,   label: "テスト",    width: 24, mono: true }
      - { key: view,   label: "テスト観点", width: 40, wrap: true }
      - { key: expect, label: "期待結果",   width: 30, wrap: true }
      - { key: result, label: "結果",      width: 8,  align: center, kind: result }
    rows:
      - [1, "data.test.ts", "タプル/オブジェクト変換・型強制・エラーケース", "正規化が仕様どおり", "未"]
      - [2, "config.test.ts", "パラメータ override・派生スケール計算", "config が一致", "未"]
      - [3, "xlsx_loader.test.ts", "範囲解析・数式セル展開・非数値エラー", "Excel入力が正しく読める", "未"]
      - [4, "svg_geom.test.ts", "座標変換・BBox・overlap・ナッジ", "幾何計算が正しい", "未"]
      - [5, "label_placement.test.ts", "10種の配置関数・leader path", "ラベル配置が一致", "未"]
      - [6, "post_layout.test.ts", "overlap解消・cascade・viewBox nudge", "後処理が一致", "未"]
      - [7, "leader_invariants.test.ts", "回帰9サンプル+番兵3で交差/円内貫通ゼロ", "leader不変条件を保証", "未"]
      - [8, "glyph_advance.test.ts", "実フォントglyph metrics（推定でない）", "字幅が実測一致", "未"]
      - [9, "verify_svg.ts", "87サンプル全件: ラベル数・overlap・円内侵入・交差・はみ出し", "ERROR ゼロ", "未"]
      - [10, "batch + out/_baseline", "決定的出力の byte-diff", "baseline と完全一致", "未"]
